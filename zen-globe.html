<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ZEN AI Co. · Arsenal Globe</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: radial-gradient(ellipse 130% 115% at 50% 52%,
      #040c1c 0%, #020612 45%, #000408 100%);
    display: grid; place-items: center; overflow: hidden;
    font-family: 'SF Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(0deg,
      transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
    z-index: 0;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: radial-gradient(rgba(0,160,255,0.05) 1px, transparent 1px);
    background-size: 32px 32px; z-index: 0;
  }
  .stage {
    position: relative; width: 560px; height: 560px; z-index: 1;
  }
  .stage::after {
    content: ""; position: absolute; left: 50%; bottom: -26px;
    width: 380px; height: 24px; transform: translateX(-50%);
    background: radial-gradient(ellipse at center,rgba(0,200,255,0.13),transparent 70%);
    filter: blur(10px);
  }
  canvas.globe {
    position: absolute; inset: 0; width: 560px; height: 560px;
    display: block;
  }
  .hud { position: absolute; inset: 0; pointer-events: none; }
  .hc {
    position: absolute; width: 24px; height: 24px;
    border-color: rgba(0,200,255,0.40); border-style: solid;
  }
  .hc.tl { top:4px; left:4px;   border-width:1.5px 0 0 1.5px; }
  .hc.tr { top:4px; right:4px;  border-width:1.5px 1.5px 0 0; }
  .hc.bl { bottom:4px; left:4px; border-width:0 0 1.5px 1.5px; }
  .hc.br { bottom:4px; right:4px; border-width:0 1.5px 1.5px 0; }
  .hl {
    position: absolute; font-size: 7.5px; letter-spacing: 0.20em;
    text-transform: uppercase; color: rgba(0,200,255,0.42);
  }
  .hl.top    { top:8px; left:50%; transform:translateX(-50%); }
  .hl.bottom { bottom:8px; left:50%; transform:translateX(-50%); }
  .hl.left   { left:8px; top:50%; transform:translateY(-50%) rotate(-90deg); }
  .hl.right  { right:8px; top:50%; transform:translateY(-50%) rotate(90deg); }
  .live {
    position:absolute; bottom:14px; right:14px;
    display:flex; align-items:center; gap:5px;
    font-size:7px; letter-spacing:0.14em; color:rgba(0,200,255,0.50);
  }
  .live::before {
    content:""; width:5px; height:5px; border-radius:50%;
    background:rgba(0,200,255,0.85); box-shadow:0 0 7px rgba(0,200,255,0.95);
    animation:blink 2.4s ease-in-out infinite;
  }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.20} }
</style>
</head>
<body>
<div class="stage">
  <canvas class="globe" id="globeCanvas"></canvas>
  <div class="hud">
    <div class="hc tl"></div><div class="hc tr"></div>
    <div class="hc bl"></div><div class="hc br"></div>
    <div class="hl top">ARSENAL · ZEN AI CO.</div>
    <div class="hl bottom">GLOBAL NETWORK ACTIVE</div>
    <div class="hl left">ZENAI.WORLD</div>
    <div class="hl right">ARSENAL.WORLD</div>
    <div class="live">LIVE</div>
  </div>
</div>
<canvas id="zSampler" width="128" height="128" style="display:none"></canvas>

window.addEventListener('DOMContentLoaded', function() {
  try {
    startGlobe();
  } catch(e) {
    console.error('Globe init error:', e);
    showError(e.message);
  }
});

function showError(msg) {
  var c = document.getElementById('globeCanvas');
  var ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(0,200,255,0.5)';
  ctx.font = '14px monospace';
  ctx.fillText('Error: ' + msg, 20, 280);
}

async function startGlobe() {
  // ── Setup ─────────────────────────────────────────────────────────────────
  var canvas = document.getElementById('globeCanvas');
  var ctx    = canvas.getContext('2d', {alpha:true, desynchronized:true});
  var DPR    = Math.min(2, window.devicePixelRatio || 1);
  var W = 560, H = 560, CX = 280, CY = 280, R = 218;

  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  ctx.scale(DPR, DPR);

  var AXIAL = -22;
  var TRAD  = AXIAL * Math.PI / 180;
  var COST  = Math.cos(TRAD), SINT = Math.sin(TRAD);

  // ── D3 projection ─────────────────────────────────────────────────────────
  var projection = d3.geoOrthographic()
    .scale(R).translate([CX, CY]).clipAngle(90).rotate([0, AXIAL, 0]);
  var path      = d3.geoPath(projection, ctx);
  var graticule = d3.geoGraticule10();
  var geoCircle = d3.geoCircle();

  // ── World atlas ───────────────────────────────────────────────────────────
  var countries = {type:'FeatureCollection',features:[]};
  var land = null;
  try {
    countries = topojson.feature(WORLD_ATLAS, WORLD_ATLAS.objects.countries);
    land      = topojson.feature(WORLD_ATLAS, WORLD_ATLAS.objects.land);
  } catch(e) { console.warn('Atlas parse failed:', e); }

  // ── Cities ────────────────────────────────────────────────────────────────
  var C = {
    NYC:[-74.0,40.7],  LAX:[-118.2,34.0], LHR:[-0.5,51.5],   NRT:[140.4,35.8],
    DXB:[55.4,25.3],   SIN:[103.8,1.4],   SYD:[151.2,-33.9], GRU:[-46.5,-23.5],
    FRA:[8.6,50.1],    HKG:[114.2,22.3],  JNB:[28.2,-26.2],  CDG:[2.5,49.0],
    IST:[29.0,41.0],   DEL:[77.1,28.6],   ICN:[126.4,37.5],  CPT:[18.4,-33.9],
    YYZ:[-79.4,43.7],  MEX:[-99.1,19.4],  BOM:[72.9,19.1],   MIA:[-80.3,25.8],
    SCL:[-70.8,-33.5], NBO:[36.9,-1.3],   ANC:[-149.9,61.2], PEK:[116.4,39.9],
    SHA:[121.5,31.2],  RTM:[4.4,51.9],    PAN:[-79.5,9.0],   HMB:[10.0,53.5],
    BCN:[2.2,41.4],    KOL:[88.4,22.6],   VAN:[-123.1,49.3], BUE:[-58.4,-34.6],
    DAR:[39.3,-6.8],   PER:[115.9,-31.9]
  };

  // ── Routes ────────────────────────────────────────────────────────────────
  var FP = [
    ['NYC','LHR'],['NYC','LAX'],['LAX','NRT'],['LHR','DXB'],
    ['DXB','SIN'],['SIN','SYD'],['NYC','GRU'],['LHR','JNB'],
    ['HKG','LAX'],['IST','DEL'],['CDG','FRA'],['NRT','SYD'],
    ['MEX','MIA'],['YYZ','LHR'],['SIN','BOM'],['ICN','LAX'],
    ['FRA','PEK'],['NRT','SCL'],['JNB','GRU'],['NBO','DXB'],
    ['ANC','NRT'],['MIA','GRU']
  ];
  var SP = [
    ['SHA','SIN'],['SIN','RTM'],['RTM','NYC'],['LAX','SHA'],
    ['CPT','PAN'],['DXB','BOM'],['BCN','NYC'],['SIN','KOL'],
    ['VAN','HKG'],['BUE','DAR'],['PER','SIN'],['HMB','MIA'],
    ['PAN','GRU'],['NRT','LAX']
  ];

  function mkRoute(a, b, type) {
    var A = C[a], B = C[b];
    var r = {
      a:A, b:B, type:type,
      t: Math.random(),
      speed: type==='plane' ? 0.018+Math.random()*0.018 : 0.005+Math.random()*0.006,
      interp: d3.geoInterpolate(A, B),
      distance: d3.geoDistance(A, B)
    };
    var N = Math.max(36, Math.round(r.distance * 60));
    r.samples = new Array(N+1);
    for (var i=0; i<=N; i++) r.samples[i] = r.interp(i/N);
    r.N = N;
    return r;
  }

  var flights = FP.map(function(p){return mkRoute(p[0],p[1],'plane');});
  var ships   = SP.map(function(p){return mkRoute(p[0],p[1],'ship');});

  // ── Sonar hubs ────────────────────────────────────────────────────────────
  var sonarHubs = [
    {lonlat:C.SIN, period:5.5,  phase:0.00, maxDeg:18},
    {lonlat:C.NYC, period:7.0,  phase:0.25, maxDeg:20},
    {lonlat:C.LHR, period:6.2,  phase:0.55, maxDeg:16},
    {lonlat:C.SYD, period:8.0,  phase:0.80, maxDeg:14}
  ];

  // ── Orbital satellites ────────────────────────────────────────────────────
  var sats = [
    {incl:0.60, raan:0.0,            period:9.0,  alt:1.32, phase:0.00},
    {incl:1.20, raan:Math.PI*2/3,    period:13.0, alt:1.48, phase:0.33},
    {incl:0.35, raan:Math.PI*4/3,    period:7.5,  alt:1.25, phase:0.66}
  ];

  // ── Z-logo constellation ──────────────────────────────────────────────────
  var zPoints  = await sampleLogoFromSrc(ZEN_LOGO_SRC, {
    samplerCanvasId:'zSampler',
    lonSpan:76, latSpan:65, lonCenter:0, latCenter:10,
    threshold:100, sampleSize:128, stride:3
  });
  var zAnchors = subsample(zPoints, 8);
  var zLinks   = buildLattice(zAnchors, 4.5);

  // ── Animation ─────────────────────────────────────────────────────────────
  var last = performance.now(), elapsed = 0, busy = false;
  var ROT  = 360 / 38;

  function frame(now) {
    if (busy) { requestAnimationFrame(frame); return; }
    busy = true;
    try {
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now; elapsed += dt;
      projection.rotate([elapsed * ROT, AXIAL, 0]);
      for (var i=0; i<flights.length; i++) flights[i].t = (flights[i].t + flights[i].speed * dt) % 1;
      for (var i=0; i<ships.length;   i++) ships[i].t   = (ships[i].t   + ships[i].speed   * dt) % 1;
      render();
    } catch(e) { console.error('Frame error:', e); }
    busy = false;
    requestAnimationFrame(frame);
  }

  // ── Render ────────────────────────────────────────────────────────────────
  function render() {
    ctx.clearRect(0, 0, W, H);
    drawDeepGlow();
    drawAtmosphere();
    drawSphereFill();
    drawGraticule();
    drawSonar();
    drawRoutes(ships, {
      color:'rgba(0,160,220,0.27)', activeColor:'rgba(0,205,255,0.70)',
      width:0.65, dash:[2.0,2.8], trailLen:0.10, headDraw:drawShip
    });
    drawLand();
    drawBorders();
    drawRoutes(flights, {
      color:'rgba(0,195,255,0.32)', activeColor:'rgba(110,240,255,0.95)',
      width:0.88, dash:[3.2,2.4], trailLen:0.18, headDraw:drawPlane
    });
    drawCityMarkers();
    drawZLattice();
    drawZConstellation();
    drawSphereOutline();
    drawTerminator();
    drawSatellites();
  }

  // ── Draw helpers ──────────────────────────────────────────────────────────
  function drawDeepGlow() {
    var g = ctx.createRadialGradient(CX,CY,R*0.88,CX,CY,R*2.1);
    g.addColorStop(0,   'rgba(0,70,130,0)');
    g.addColorStop(0.14,'rgba(0,95,175,0.055)');
    g.addColorStop(0.38,'rgba(0,55,110,0.030)');
    g.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  }

  function drawAtmosphere() {
    var g = ctx.createRadialGradient(CX,CY,R*0.97,CX,CY,R*1.12);
    g.addColorStop(0,    'rgba(0,195,255,0)');
    g.addColorStop(0.28, 'rgba(0,178,242,0.22)');
    g.addColorStop(0.62, 'rgba(0,140,200,0.07)');
    g.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    var g2 = ctx.createRadialGradient(CX,CY,R*1.01,CX,CY,R*1.28);
    g2.addColorStop(0,    'rgba(0,160,230,0)');
    g2.addColorStop(0.22, 'rgba(0,140,210,0.08)');
    g2.addColorStop(0.65, 'rgba(0,100,170,0.025)');
    g2.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = g2; ctx.fillRect(0,0,W,H);

    ctx.beginPath(); ctx.arc(CX,CY,R*1.022,0,Math.PI*2);
    ctx.strokeStyle = 'rgba(0,200,255,0.14)'; ctx.lineWidth=0.9; ctx.stroke();
  }

  function drawSphereFill() {
    ctx.beginPath(); path({type:'Sphere'});
    var g = ctx.createRadialGradient(CX-58,CY-62,R*0.04,CX+42,CY+52,R*1.06);
    g.addColorStop(0,   'rgba(7,20,44,0.93)');
    g.addColorStop(0.5, 'rgba(3,11,27,0.97)');
    g.addColorStop(1,   'rgba(1,5,14,0.995)');
    ctx.fillStyle = g; ctx.fill();
  }

  function drawGraticule() {
    ctx.beginPath(); path(graticule);
    ctx.strokeStyle = 'rgba(0,148,210,0.10)'; ctx.lineWidth=0.44; ctx.stroke();
  }

  function drawLand() {
    if (!land) return;
    ctx.beginPath(); path(land);
    ctx.fillStyle = 'rgba(0,135,195,0.085)'; ctx.fill();
  }

  function drawBorders() {
    ctx.beginPath(); path(countries);
    ctx.strokeStyle = 'rgba(0,188,240,0.55)';
    ctx.lineWidth=0.56; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
  }

  function drawSphereOutline() {
    ctx.beginPath(); path({type:'Sphere'});
    ctx.strokeStyle = 'rgba(0,205,255,0.18)'; ctx.lineWidth=4.5; ctx.stroke();
    ctx.beginPath(); path({type:'Sphere'});
    ctx.strokeStyle = 'rgba(0,212,255,0.78)'; ctx.lineWidth=1.15; ctx.stroke();
  }

  function drawTerminator() {
    var g = ctx.createRadialGradient(CX-56,CY-64,R*0.14,CX+14,CY+18,R*1.06);
    g.addColorStop(0,    'rgba(0,75,135,0.14)');
    g.addColorStop(0.50, 'rgba(0,0,0,0)');
    g.addColorStop(0.90, 'rgba(0,0,8,0.27)');
    g.addColorStop(1,    'rgba(0,0,12,0.56)');
    ctx.save(); ctx.beginPath(); path({type:'Sphere'}); ctx.clip();
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H); ctx.restore();
  }

  function drawRoutes(list, opts) {
    // Dashed static paths
    ctx.save();
    ctx.setLineDash(opts.dash);
    ctx.strokeStyle = opts.color; ctx.lineWidth=opts.width; ctx.lineCap='round';
    ctx.beginPath();
    for (var vi=0; vi<list.length; vi++) {
      var v = list[vi], ok=false;
      for (var si=0; si<v.samples.length; si++) {
        var p = projection(v.samples[si]);
        if (!p) { ok=false; continue; }
        if (!ok) { ctx.moveTo(p[0],p[1]); ok=true; } else { ctx.lineTo(p[0],p[1]); }
      }
    }
    ctx.stroke(); ctx.restore();

    // Bright active trails
    ctx.save();
    ctx.setLineDash([]);
    ctx.strokeStyle = opts.activeColor; ctx.lineWidth=opts.width*1.6; ctx.lineCap='round';
    ctx.shadowColor = opts.activeColor; ctx.shadowBlur=5;
    ctx.beginPath();
    for (var vi=0; vi<list.length; vi++) {
      var v = list[vi];
      var t0 = Math.max(0, v.t - opts.trailLen);
      var segN = Math.max(6, Math.round((v.t - t0) * v.N));
      var ok = false;
      for (var si=0; si<=segN; si++) {
        var tt = t0 + (v.t-t0)*(si/segN);
        var p  = projection(v.interp(tt));
        if (!p) { ok=false; continue; }
        if (!ok) { ctx.moveTo(p[0],p[1]); ok=true; } else { ctx.lineTo(p[0],p[1]); }
      }
    }
    ctx.stroke(); ctx.restore();

    // Heads
    for (var vi=0; vi<list.length; vi++) {
      var v = list[vi];
      var p = projection(v.interp(v.t)); if (!p) continue;
      var pN = projection(v.interp(Math.min(1, v.t+0.002)));
      var ang = pN ? Math.atan2(pN[1]-p[1], pN[0]-p[0]) : 0;
      opts.headDraw(p[0], p[1], ang);
    }
  }

  function drawPlane(x, y, ang) {
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
    ctx.shadowColor = 'rgba(0,220,255,0.95)'; ctx.shadowBlur=5;
    ctx.fillStyle   = 'rgba(255,255,255,1)';
    ctx.beginPath();
    ctx.moveTo(4.2,0); ctx.lineTo(-2.4,2.0);
    ctx.lineTo(-1.5,0); ctx.lineTo(-2.4,-2.0); ctx.closePath();
    ctx.fill();
    ctx.fillRect(-0.2,-0.38,2.0,0.76);
    ctx.restore();
  }

  function drawShip(x, y, ang) {
    ctx.save(); ctx.translate(x,y); ctx.rotate(ang);
    ctx.shadowColor = 'rgba(0,200,255,0.85)'; ctx.shadowBlur=4;
    ctx.strokeStyle = 'rgba(0,200,255,0.52)'; ctx.lineWidth=0.65;
    ctx.beginPath();
    ctx.moveTo(-1.0,-1.7); ctx.lineTo(-4.4,-2.9);
    ctx.moveTo(-1.0, 1.7); ctx.lineTo(-4.4, 2.9);
    ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    ctx.beginPath();
    ctx.moveTo(3.2,0); ctx.lineTo(-1.0,1.6); ctx.lineTo(-1.0,-1.6); ctx.closePath();
    ctx.fill(); ctx.restore();
  }

  function drawCityMarkers() {
    var keys = Object.keys(C);
    for (var i=0; i<keys.length; i++) {
      var p = projection(C[keys[i]]); if (!p) continue;
      var ph = (elapsed*0.6 + i*0.18) % 1;
      var r  = ph * 8;
      if (r > 0.1) {
        var a = (1-ph)*(1-ph)*0.42;
        ctx.beginPath(); ctx.arc(p[0],p[1],r,0,Math.PI*2);
        ctx.strokeStyle = 'rgba(0,200,255,'+a.toFixed(3)+')';
        ctx.lineWidth=0.7; ctx.stroke();
      }
    }
    ctx.shadowColor='rgba(0,220,255,0.9)'; ctx.shadowBlur=4;
    ctx.fillStyle='rgba(255,255,255,1)';
    ctx.beginPath();
    for (var i=0; i<keys.length; i++) {
      var p = projection(C[keys[i]]); if (!p) continue;
      ctx.moveTo(p[0]+1.35, p[1]);
      ctx.arc(p[0], p[1], 1.35, 0, Math.PI*2);
    }
    ctx.fill(); ctx.shadowBlur=0;
  }

  function drawSonar() {
    for (var hi=0; hi<sonarHubs.length; hi++) {
      var hub = sonarHubs[hi];
      drawOneSonar(hub, ((elapsed/hub.period)+hub.phase)%1);
      drawOneSonar(hub, ((elapsed/hub.period)+hub.phase+0.5)%1);
      var pp = projection(hub.lonlat);
      if (pp) {
        ctx.shadowColor='rgba(0,210,255,0.95)'; ctx.shadowBlur=7;
        ctx.fillStyle='rgba(0,210,255,1)';
        ctx.beginPath(); ctx.arc(pp[0],pp[1],2.4,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
      }
    }
  }

  function drawOneSonar(hub, phase) {
    if (phase <= 0) return;
    var a = (1-phase)*(1-phase)*0.52;
    geoCircle.center(hub.lonlat).radius(phase*hub.maxDeg).precision(3);
    ctx.beginPath(); path(geoCircle());
    ctx.strokeStyle = 'rgba(0,200,255,'+a.toFixed(3)+')';
    ctx.lineWidth = 0.9 + phase*0.35; ctx.stroke();
  }

  function satState(s, t) {
    var nu = (s.phase + t/s.period) * Math.PI * 2;
    var x=Math.cos(nu), y=Math.sin(nu), z=0;
    var ci=Math.cos(s.incl), si=Math.sin(s.incl);
    var y1=y*ci-z*si, z1=y*si+z*ci; y=y1; z=z1;
    var cO=Math.cos(s.raan), sO=Math.sin(s.raan);
    var x2=x*cO-y*sO, y2=x*sO+y*cO; x=x2; y=y2;
    x*=s.alt; y*=s.alt; z*=s.alt;
    var yT=y*COST-z*SINT, zT=y*SINT+z*COST; y=yT; z=zT;
    var sx=CX+x*R, sy=CY-y*R;
    var r2=x*x+y*y;
    return {sx:sx, sy:sy, z:z, visible:z>=0||r2>1.0, front:z>=0};
  }

  function drawSatellites() {
    var BANDS=6, SPB=8;
    for (var si=0; si<sats.length; si++) {
      var s=sats[si], dtail=s.period*0.32, total=BANDS*SPB;
      var pts=new Array(total+1);
      for (var i=0; i<=total; i++) pts[i]=satState(s, elapsed-dtail*(i/total));
      for (var b=BANDS-1; b>=0; b--) {
        var hf=1-b/BANDS, lo=b*SPB, hi=lo+SPB;
        var mid=pts[(lo+hi)>>1];
        if (!mid||!mid.visible) continue;
        var a=(mid.front?0.75:0.20)*hf;
        if (a<0.04) continue;
        ctx.beginPath(); var ok=false;
        for (var i=lo; i<=hi; i++) {
          var st=pts[i]; if(!st||!st.visible){ok=false;continue;}
          if(!ok){ctx.moveTo(st.sx,st.sy);ok=true;}else{ctx.lineTo(st.sx,st.sy);}
        }
        ctx.strokeStyle='rgba(0,210,255,'+a.toFixed(3)+')';
        ctx.lineWidth=0.7+1.8*hf; ctx.lineCap='round'; ctx.stroke();
      }
      var head=pts[0]; if(!head||!head.visible) continue;
      var ha=head.front?1:0.45;
      ctx.shadowColor='rgba(0,225,255,0.96)'; ctx.shadowBlur=14;
      ctx.fillStyle='rgba(0,210,255,'+(0.13*ha).toFixed(3)+')';
      ctx.beginPath(); ctx.arc(head.sx,head.sy,9,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(0,200,255,'+(0.42*ha).toFixed(3)+')'; ctx.lineWidth=0.9;
      ctx.beginPath(); ctx.arc(head.sx,head.sy,5.8,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,'+ha.toFixed(3)+')';
      ctx.beginPath(); ctx.arc(head.sx,head.sy,2.8,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0;
    }
  }

  function drawZConstellation() {
    if (!zPoints||!zPoints.length) return;
    ctx.shadowColor='rgba(0,210,255,0.68)'; ctx.shadowBlur=3;
    ctx.fillStyle='rgba(255,255,255,0.92)'; ctx.globalAlpha=0.92;
    ctx.beginPath();
    for (var i=0; i<zPoints.length; i++) {
      var proj=projection(zPoints[i]); if (!proj) continue;
      var dx=proj[0]-CX, dy=proj[1]-CY;
      var rho=Math.sqrt(dx*dx+dy*dy)/R;
      var sz=1.65*(1-rho*0.40);
      if (sz>0.1) { ctx.moveTo(proj[0]+sz,proj[1]); ctx.arc(proj[0],proj[1],sz,0,Math.PI*2); }
    }
    ctx.fill(); ctx.globalAlpha=1; ctx.shadowBlur=0;
  }

  function drawZLattice() {
    if (!zLinks||!zLinks.length) return;
    ctx.strokeStyle='rgba(0,200,255,0.26)'; ctx.lineWidth=0.48;
    ctx.beginPath();
    for (var i=0; i<zLinks.length; i++) {
      var pa=projection(zLinks[i][0]), pb=projection(zLinks[i][1]);
      if (!pa||!pb) continue;
      ctx.moveTo(pa[0],pa[1]); ctx.lineTo(pb[0],pb[1]);
    }
    ctx.stroke();
  }

  // ── Logo sampling ─────────────────────────────────────────────────────────
  function sampleLogoFromSrc(src, opts) {
    return new Promise(function(resolve) {
      var img = new Image();
      img.onload = function() {
        try {
          var c = document.getElementById(opts.samplerCanvasId);
          c.width = opts.sampleSize; c.height = opts.sampleSize;
          var cx = c.getContext('2d');
          cx.fillStyle='#000'; cx.fillRect(0,0,opts.sampleSize,opts.sampleSize);
          var pad=6, dst=opts.sampleSize-pad*2;
          var iw=img.naturalWidth, ih=img.naturalHeight;
          var scale=Math.min(dst/iw, dst/ih);
          cx.drawImage(img,
            (opts.sampleSize-iw*scale)/2, (opts.sampleSize-ih*scale)/2,
            iw*scale, ih*scale);
          var data=cx.getImageData(0,0,opts.sampleSize,opts.sampleSize).data;
          var pts=[];
          for (var py=0; py<opts.sampleSize; py+=opts.stride) {
            for (var px=0; px<opts.sampleSize; px+=opts.stride) {
              var idx=(py*opts.sampleSize+px)*4;
              var lum=0.299*data[idx]+0.587*data[idx+1]+0.114*data[idx+2];
              if (lum > opts.threshold) {
                pts.push([
                  opts.lonCenter + (((px+0.5)/opts.sampleSize)-0.5)*opts.lonSpan,
                  opts.latCenter - (((py+0.5)/opts.sampleSize)-0.5)*opts.latSpan
                ]);
              }
            }
          }
          resolve(pts);
        } catch(e) { console.warn('Logo sample error:', e); resolve([]); }
      };
      img.onerror = function() { console.warn('Logo load error'); resolve([]); };
      img.src = src;
    });
  }

  function subsample(arr, step) {
    var out=[];
    for (var i=0; i<arr.length; i+=step) out.push(arr[i]);
    return out;
  }

  function buildLattice(anchors, maxDeg) {
    var links=[], seen={};
    for (var i=0; i<anchors.length; i++) {
      var a=anchors[i], cands=[];
      for (var j=0; j<anchors.length; j++) {
        if (i===j) continue;
        var d=Math.sqrt(Math.pow(a[0]-anchors[j][0],2)+Math.pow(a[1]-anchors[j][1],2));
        if (d<maxDeg) cands.push([d,j]);
      }
      cands.sort(function(x,y){return x[0]-y[0];});
      for (var k=0; k<Math.min(2,cands.length); k++) {
        var j=cands[k][1];
        var key=i<j?i+'-'+j:j+'-'+i;
        if (seen[key]) continue;
        seen[key]=true; links.push([a,anchors[j]]);
      }
    }
    return links;
  }

  // ── Start ─────────────────────────────────────────────────────────────────
  render();
  requestAnimationFrame(function(t){ last=t; frame(t); });
}
</script>
